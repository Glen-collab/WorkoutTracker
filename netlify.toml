[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the Flask backend on EC2 (avoids CORS entirely).
# This used to point at the retired WordPress host
# (bestrongagain.com/workout-programs/api/general/), which 403s — every real
# call in src/ hardcodes the absolute app.bestrongagain.com URL, so the stale
# proxy went unnoticed. Straight pass-through: /api/media/* and /api/workout/*
# both resolve to the same path on the backend.
[[redirects]]
  from = "/api/*"
  to = "https://app.bestrongagain.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or its registration script — Safari
# was holding onto stale sw.js for hours, which left the tab pinned to
# the previous build's JS even after a deploy. With no-cache, every
# tab visit re-fetches the SW; new revisions install + skipWaiting
# immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# index.html must also be fresh each time so the bootstrap script
# (which manages SW updates) reflects the latest build's logic.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
