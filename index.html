<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Track your workouts and build strength" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout Tracker" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <title>Workout Tracker</title>
    <script>
      // ── Service Worker management ─────────────────────────────
      // BUILD_VERSION is bumped on every deploy where we want clients to
      // get fresh assets immediately (e.g. CSS/JSX changes that the SW's
      // existing revision tracking missed). When localStorage's stored
      // version differs from this, we unregister the SW + clear caches
      // once, then reload. Subsequent loads use the new SW normally.
      var BUILD_VERSION = '__BUILD_VERSION__';
      if ('serviceWorker' in navigator) {
        var isTvPath = window.location.pathname.startsWith('/tv');
        var stored = '';
        try { stored = localStorage.getItem('bsa_sw_build') || ''; } catch (e) {}
        // Hard cap: at most ONE nuclear reset per tab, ever.
        //
        // The reset ends in a reload, and the reload re-runs this script. If a
        // NEW deploy lands in between — a real case while shipping fixes during
        // a live session — BUILD_VERSION has moved again, so it resets and
        // reloads again, and the athlete sits on a white screen that never
        // stops loading. localStorage alone couldn't catch that, because each
        // pass legitimately saw a different version.
        var busted = '';
        try { busted = sessionStorage.getItem('bsa_sw_busted') || ''; } catch (e) {}
        // /tv is deliberately OUTSIDE the session guard. The guard exists to
        // stop a bust->reload->bust cycle, and /tv never reloads (see below),
        // so it cannot cycle. Including it would have been worse than the bug:
        // a Pi holds its tab open for days, sessionStorage survives reloads, so
        // the wall display would bust once and then serve stale code forever —
        // the exact failure that already costs a Pi reboot to clear.
        var needsBust = isTvPath || (stored !== BUILD_VERSION && !busted);

        if (needsBust) {
          // Nuclear option: unregister all SWs + clear all caches.
          // Used unconditionally on /tv, and once per build elsewhere.
          // Safari was caching sw.js for hours; this guarantees a fresh
          // bundle on the next reload.
          try { localStorage.setItem('bsa_sw_build', BUILD_VERSION); } catch (e) {}
          try { sessionStorage.setItem('bsa_sw_busted', '1'); } catch (e) {}
          var didReload = false;
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function(rs) {
              return Promise.all(rs.map(function(r) { return r.unregister(); }));
            }),
            'caches' in window
              ? caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                })
              : Promise.resolve()
          ]).then(function() {
            // Only reload outside /tv (which doesn't need a reload — the
            // /tv flow is single-shot and already fetched fresh assets).
            if (!isTvPath) { didReload = true; window.location.reload(); }
          });
          // Belt and braces: if unregistering or cache-clearing never settles
          // — Safari can leave either pending — the reload above never fires
          // and the athlete is left on a blank page with a spinner. Go anyway.
          if (!isTvPath) {
            setTimeout(function () { if (!didReload) window.location.reload(); }, 3000);
          }
        } else {
          // Steady-state: ping for new SW updates; activate any waiting
          // worker immediately; reload once when the controller swaps.
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            });
          });
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
