<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Track your workouts and build strength" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout Tracker" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <title>Workout Tracker</title>

    <!-- Start the TLS + DNS handshake to the API before any JS runs. The first
         call after a cache reset otherwise pays for connection setup on gym
         wifi at the exact moment the athlete is staring at a blank screen. -->
    <link rel="preconnect" href="https://app.bestrongagain.com" crossorigin />
    <link rel="dns-prefetch" href="https://app.bestrongagain.com" />

    <script>
      // Wake the backend NOW, not after the bundle parses and React mounts.
      // Flask on EC2 cold-starts, and this is the single biggest chunk of the
      // wait on the first load of the day. Fire and forget — it's a warmup.
      try { fetch('https://app.bestrongagain.com/api/health', { mode: 'cors' }).catch(function(){}); } catch (e) {}
    </script>
    <script>
      // ── Service Worker management ─────────────────────────────
      // BUILD_VERSION is bumped on every deploy where we want clients to
      // get fresh assets immediately (e.g. CSS/JSX changes that the SW's
      // existing revision tracking missed). When localStorage's stored
      // version differs from this, we unregister the SW + clear caches
      // once, then reload. Subsequent loads use the new SW normally.
      var BUILD_VERSION = '__BUILD_VERSION__';
      if ('serviceWorker' in navigator) {
        var isTvPath = window.location.pathname.startsWith('/tv');
        var stored = '';
        try { stored = localStorage.getItem('bsa_sw_build') || ''; } catch (e) {}

        // The "already reset once" marker lives in the URL, NOT in storage.
        //
        // This is the fix for a blank page that never stopped loading when the
        // app was opened by scanning a QR from the iOS Camera app. Safari can
        // refuse or partition storage on some launch paths, and every previous
        // guard here depended on storage that silently failed:
        //   localStorage.getItem  -> '' , so the version ALWAYS looked stale
        //   sessionStorage.setItem -> throws, caught, so the marker never stuck
        // The reset ends in a reload, the reload re-runs this script, nothing
        // was remembered, so it reset and reloaded again — forever. It worked
        // fine in a normal tab, which is why it looked intermittent.
        //
        // A query param survives the reload with no storage of any kind, so the
        // cycle is capped whatever Safari decides to allow. It is stripped back
        // out below so nobody sees it in the address bar.
        var alreadyBusted = window.location.search.indexOf('_swb=1') !== -1;
        if (alreadyBusted) {
          try {
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('_swb');
            window.history.replaceState({}, '', cleanUrl.toString());
          } catch (e) {}
        }

        // /tv is deliberately OUTSIDE the guard. The guard exists to stop a
        // bust->reload->bust cycle, and /tv never reloads (see below), so it
        // cannot cycle. Including it would be worse than the bug: a Pi holds
        // its tab open for days, so the wall display would bust once and then
        // serve stale code forever — the exact failure that already costs a Pi
        // reboot to clear.
        var needsBust = isTvPath || (stored !== BUILD_VERSION && !alreadyBusted);

        if (needsBust) {
          // Nuclear option: unregister all SWs + clear all caches.
          // Used unconditionally on /tv, and once per build elsewhere.
          // Safari was caching sw.js for hours; this guarantees a fresh
          // bundle on the next reload.
          try { localStorage.setItem('bsa_sw_build', BUILD_VERSION); } catch (e) {}
          var didReload = false;
          // Reload carrying the marker, so the next pass can't reset again even
          // with every storage API unavailable. `replace` so Back doesn't walk
          // the athlete into the reset again.
          var goOn = function () {
            if (didReload || isTvPath) return;
            didReload = true;
            try {
              var next = new URL(window.location.href);
              next.searchParams.set('_swb', '1');
              window.location.replace(next.toString());
            } catch (e) { window.location.reload(); }
          };
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function(rs) {
              return Promise.all(rs.map(function(r) { return r.unregister(); }));
            }),
            'caches' in window
              ? caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                })
              : Promise.resolve()
          ]).then(goOn);
          // Belt and braces: if unregistering or cache-clearing never settles
          // — Safari can leave either pending — the handler above never fires
          // and the athlete is left on a blank page with a spinner. Go anyway.
          if (!isTvPath) setTimeout(goOn, 3000);
        } else {
          // Steady-state: ping for new SW updates; activate any waiting
          // worker immediately; reload once when the controller swaps.
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            });
          });
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      }
    </script>
  </head>
  <body>
    <!-- Boot splash. Plain markup inside #root, so it paints on the FIRST frame
         — before the bundle downloads, before React exists — and is thrown away
         the moment React renders over it.

         The cache reset deletes everything and the next load re-fetches the
         whole app, which on gym wifi is long enough that an empty page reads as
         "it's broken, scan it again". There was nothing in the document to
         look at: an empty #root is a white screen by definition. No script, no
         stylesheet, nothing that can fail. -->
    <style>
      @keyframes bsaSpin { to { transform: rotate(360deg); } }
      #bsa-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #bsa-boot .ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff;
        animation: bsaSpin 0.9s linear infinite;
      }
      #bsa-boot .msg { font-size: 15px; font-weight: 600; opacity: 0.9; }
      #bsa-boot .sub { font-size: 12.5px; opacity: 0.6; max-width: 260px; text-align: center; line-height: 1.5; }
    </style>
    <div id="root">
      <div id="bsa-boot">
        <div class="ring"></div>
        <div class="msg">Loading your workout…</div>
        <div class="sub" id="bsa-boot-sub">First load after an update takes a few seconds.</div>
        <button id="bsa-boot-retry" onclick="location.reload()" style="display:none;padding:13px 26px;border:none;border-radius:11px;background:#fff;color:#4554c9;font-size:15px;font-weight:800;cursor:pointer;">Tap to retry</button>
      </div>
    </div>
    <script>
      // If the bundle never arrives — dead wifi mid-set, a failed asset — the
      // spinner would otherwise turn forever. Give them a way out rather than
      // an animation that lies about progress.
      setTimeout(function () {
        var sub = document.getElementById('bsa-boot-sub');
        var btn = document.getElementById('bsa-boot-retry');
        if (!sub || !btn) return;   // React already took over
        sub.textContent = 'This is taking longer than it should. Check your signal, then try again.';
        btn.style.display = 'block';
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
